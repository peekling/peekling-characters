name: Prepare character pack release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: character-pack-release-pr
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run check
      - uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: npm run version-packages
          commit: "chore: version character packs"
          title: "chore: version character packs"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
